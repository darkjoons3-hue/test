name: Build Riddle NPC

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (GCC) ──
          - name: "Linux (g++)"
            os: ubuntu-latest
            compiler: g++
            cxx_flags: "-std=c++17 -Wall -Wextra -O2"
            output: "riddle_npc"

          # ── macOS (Clang) ──
          - name: "macOS (clang++)"
            os: macos-latest
            compiler: clang++
            cxx_flags: "-std=c++17 -Wall -Wextra -O2"
            output: "riddle_npc"

          # ── Windows (MSVC) ──
          - name: "Windows (MSVC)"
            os: windows-latest
            compiler: cl
            cxx_flags: "/std:c++17 /utf-8 /EHsc /O2 /W4"
            output: "riddle_npc.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # На Windows подготавливаем окружение MSVC (cl.exe)
      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.compiler }} ${{ matrix.cxx_flags }} main.cpp -o ${{ matrix.output }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          ${{ matrix.compiler }} ${{ matrix.cxx_flags }} main.cpp /Fe:${{ matrix.output }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: riddle_npc-${{ runner.os }}
          path: ${{ matrix.output }}
          retention-days: 7
